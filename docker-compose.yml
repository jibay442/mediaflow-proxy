services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mfp:
    build: .
    restart: unless-stopped
    expose:
      - '8888'
    environment:
      API_PASSWORD: ${API_PASSWORD}
      FORWARDED_ALLOW_IPS: "*"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
